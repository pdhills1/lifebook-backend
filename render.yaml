services:
  - type: web
    name: my-story
    runtime: node
    plan: free
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: INVITE_CODE
        sync: false
      - key: RESEND_API_KEY
        sync: false
