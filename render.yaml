services:
  - type: web
    name: lifebook-backend
    runtime: node
    buildCommand: npm install
    startCommand: node src/server.js
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: NOTIFY_ADMIN_EMAIL
        sync: false
      - key: PHOTOS_BUCKET
        value: lifebook-photos
      - key: PDFS_BUCKET
        value: lifebook-pdfs
      - key: PORT
        value: 3000
      - key: FRONTEND_URL
        sync: false
